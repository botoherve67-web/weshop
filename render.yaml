services:
  - type: web
    name: herveshop
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: WeShop
      - key: APP_DEBUG
        value: "false"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_SSLMODE
        value: require
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: WeShop
      - key: CONTACT_EMAIL
        sync: false
      - key: GOOGLE_TAG_ID
        value: G-MXM8MXYC04
      - key: GOOGLE_ADSENSE_CLIENT
        value: ca-pub-4481147664302185
      - key: GOOGLE_ADS_CONVERSION_ID
        sync: false
      - key: GOOGLE_ADS_CONVERSION_LABEL
        sync: false
      - key: MEDIA_DRIVER
        value: local
      - key: MEDIA_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
