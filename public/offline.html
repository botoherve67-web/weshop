<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0969ed">
<meta name="robots" content="noindex, nofollow">
<title>Connexion interrompue — WeShop</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(160deg,#eff7ff,#fff 65%);color:#173f5f;padding:24px}
  .box{width:min(100%,440px);padding:32px 26px;border:1px solid #e2eaf3;border-radius:20px;background:#fff;text-align:center;box-shadow:0 12px 30px rgba(16,46,85,.08)}
  img{width:112px;height:auto;margin-bottom:16px}
  h1{font-size:1.55rem;margin:0 0 10px}
  p{margin:0 0 16px;line-height:1.6;color:#52606d}
  .hint{padding:12px;border-radius:10px;background:#f2f7fc;font-size:.9rem}
  button{background:#0969ed;color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer}
  button:focus-visible{outline:3px solid #173f5f;outline-offset:3px}
  @media(prefers-reduced-motion:no-preference){.box{animation:appear .25s ease-out}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body>
<div class="box">
  <img src="/images/weshop-logo.png" alt="WeShop">
  <h1>Connexion interrompue</h1>
  <p>La boutique a besoin d’une connexion pour afficher les informations à jour et finaliser vos achats.</p>
  <p class="hint">Votre panier, votre compte et vos commandes ne sont jamais enregistrés dans le cache hors ligne. Reconnectez-vous puis réessayez.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</div>
</body>
</html>
